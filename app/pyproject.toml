[project]
name = "techmart-forecast-adjustments"
version = "0.1.0"
description = "TechMart Demand Forecast Adjustments — Databricks App (read-only over Unity Catalog via databricks-sql-connector)"
requires-python = ">=3.11"
# Pinned to established 2024 releases: the Apps build pypi proxy has not mirrored
# the newest 2026 versions and times out fetching them. Transitives are pinned
# explicitly for the same reason.
dependencies = [
    "starlette==0.38.6",
    "uvicorn==0.30.6",
    "click==8.1.7",
    "anyio==4.4.0",
    "h11==0.14.0",
    "idna==3.8",
    "sniffio==1.3.1",
    "typing-extensions==4.12.2",
]

# Local/dev-only deps (opt-in group; the Apps runtime's `uv sync` skips it since it
# is not the default `dev` group). databricks-sdk is used only for LOCAL auth (reading
# the CLI profile token); the deployed app authenticates via injected SP creds + requests.
# Locally: `uv run --group test pytest backend/tests` / `uv run --group test uvicorn ...`
[dependency-groups]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "databricks-sdk>=0.30.0",
]

[tool.uv]
package = false
# The Apps builder's pypi proxy intermittently drops parallel connections;
# serialize downloads to keep the install reliable.
concurrent-downloads = 2
