[project]
name = "techmart-forecast-adjustments"
version = "0.1.0"
description = "TechMart Demand Forecast Adjustments — Databricks App (Starlette; read-only UC via the SQL Statement Execution REST API over stdlib urllib)"
requires-python = ">=3.11"
# Runtime deps are STARLETTE + uvicorn only — both pure-Python (py3-none-any). The
# Apps build pip proxy connect-fails on every compiled manylinux x86_64 wheel we hit:
# numpy (databricks-sql-connector->pandas), cryptography (databricks-sdk->google-auth),
# and pydantic-core (fastapi->pydantic) — so FastAPI is NOT deployable here. Starlette
# is a real ASGI framework with no pydantic-core, so it installs cleanly. Auth + SQL
# go through stdlib urllib against the REST APIs (backend/httpjson.py, config.py, db.py).
dependencies = [
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

# Local/dev-only deps (opt-in group; the Apps runtime's `uv sync` skips it since it is
# not the default group). databricks-sdk is used ONLY for the local token fallback in
# config.py (lazy import); it never installs in the deployed app.
# Locally: `uv run --group test pytest backend/tests`
#          `uv run --group test uvicorn backend.main:app`
[dependency-groups]
test = [
    "pytest>=8.0.0",
    "databricks-sdk>=0.30.0",
]

[tool.uv]
package = false
# The Apps builder's pypi proxy intermittently drops parallel connections
# (transient "client error (Connect)" on random small wheels); serialize
# downloads to keep the install reliable.
concurrent-downloads = 1
