bundle:
  name: techmart

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog to hold techmart_* schemas.
    default: stable_classic_ppke9o
  schema_prefix:
    description: Schema name prefix (schemas are <prefix>core, <prefix>finance, ...).
    default: techmart_
  scale_profile:
    description: Scale profile (smoke | demo_lean | showcase | stress).
    default: showcase
  warehouse_id:
    description: SQL warehouse id for the ai_query text-fill task (supplied per-deploy).
  llm_endpoint:
    description: Foundation Model endpoint for ai_query text generation.
    default: databricks-meta-llama-3-1-8b-instruct
  lakebase_instance:
    description: Lakebase (Postgres) database instance name (supplied per-deploy).
  lakebase_database:
    description: Lakebase database name for techmart_ops write-back tables.
    default: techmart
  lakebase_capacity:
    description: Lakebase instance capacity unit.
    default: CU_1

targets:
  dev:
    mode: development
    default: true
    # Host is supplied per-deploy (CLI --profile / DATABRICKS_HOST); never committed.
    # dev defaults to the tiny `smoke` profile so routine `bundle run` is cheap/fast.
    # Run showcase (or any profile) explicitly, e.g.:
    #   databricks bundle run generate_facts -t dev -p <profile> --var="scale_profile=showcase"
    variables:
      scale_profile: smoke
