[project]
name = "techmart-forecast-adjustments"
version = "0.1.0"
description = "TechMart Demand Forecast Adjustments — Databricks App (FastAPI, read-only over Unity Catalog via the SDK Statement Execution API)"
requires-python = ">=3.11"
# NOTE: no databricks-sql-connector — its pandas->numpy/pyarrow chain cannot be
# fetched by the Apps build pip proxy (numpy wheel connect-fails). SQL runs through
# the pure-Python SDK Statement Execution API instead (see backend/db.py).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "databricks-sdk>=0.30.0",
]

# Local/dev-only deps (opt-in group; the Apps runtime's `uv sync` skips it since it is
# not the default `dev` group).
# Locally: `uv run --group test pytest backend/tests`
#          `uv run python -m backend.main`  (or: uv run uvicorn backend.main:app)
[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
# The Apps builder's pypi proxy intermittently drops parallel connections
# (transient "client error (Connect)" on random small wheels); serialize
# downloads to keep the install reliable.
concurrent-downloads = 1
