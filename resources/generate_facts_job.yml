resources:
  jobs:
    generate_facts:
      name: techmart-generate
      tasks:
        - task_key: generate_dims
          notebook_task:
            notebook_path: ../notebooks/generate_dims.py
            base_parameters:
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              scale_profile: ${var.scale_profile}
        - task_key: generate_facts
          depends_on:
            - task_key: generate_dims
          notebook_task:
            notebook_path: ../notebooks/generate_facts.py
            base_parameters:
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              scale_profile: ${var.scale_profile}
        - task_key: generate_finance
          depends_on:
            - task_key: generate_facts
          notebook_task:
            notebook_path: ../notebooks/generate_finance.py
            base_parameters:
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              scale_profile: ${var.scale_profile}
        - task_key: generate_ai
          depends_on:
            - task_key: generate_facts
          notebook_task:
            notebook_path: ../notebooks/generate_ai.py
            base_parameters:
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              scale_profile: ${var.scale_profile}
        - task_key: generate_ai_text
          depends_on:
            - task_key: generate_ai
          sql_task:
            warehouse_id: ${resources.sql_warehouses.techmart_warehouse.id}
            file:
              path: ../resources/generate_ai_text.sql
            parameters:
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              llm_endpoint: ${var.llm_endpoint}
        - task_key: generate_ops
          depends_on:
            - task_key: generate_facts
            - task_key: generate_ai
          notebook_task:
            notebook_path: ../notebooks/generate_ops.py
            base_parameters:
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              scale_profile: ${var.scale_profile}
              lakebase_instance: ${var.lakebase_instance}
              lakebase_database: ${var.lakebase_database}
        - task_key: generate_semantic
          depends_on:
            - task_key: generate_facts
            - task_key: generate_finance
            - task_key: generate_ai
          notebook_task:
            notebook_path: ../notebooks/generate_semantic.py
            base_parameters:
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              scale_profile: ${var.scale_profile}
