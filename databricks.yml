bundle:
  name: techmart

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog to hold techmart_* schemas.
    default: stable_classic_ppke9o
  schema_prefix:
    description: Schema name prefix (schemas are <prefix>core, <prefix>finance, ...).
    default: techmart_
  scale_profile:
    description: Scale profile (smoke | demo_lean | showcase | stress).
    default: showcase

targets:
  dev:
    mode: development
    default: true
    # Host is supplied per-deploy (CLI --profile / DATABRICKS_HOST); never committed.
    # dev defaults to the tiny `smoke` profile so routine `bundle run` is cheap/fast.
    # Run showcase (or any profile) explicitly, e.g.:
    #   databricks bundle run generate_facts -t dev -p <profile> --var="scale_profile=showcase"
    variables:
      scale_profile: smoke
