[project]
name = "techmart-forecast-adjustments"
version = "0.1.0"
description = "TechMart Demand Forecast Adjustments — Databricks App (read-only over Unity Catalog via databricks-sql-connector)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "databricks-sql-connector>=3.7.0",
    "databricks-sdk>=0.30.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
